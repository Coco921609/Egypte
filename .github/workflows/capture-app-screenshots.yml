name: Capture real app screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Capture after every main-branch update, except the screenshots
    # generated by this workflow itself (prevents an endless run loop).
    paths-ignore:
      - "docs/screenshots/**"

permissions:
  contents: write

concurrency:
  group: app-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build the production Flutter widgets for screenshot capture
        run: |
          flutter pub get
          flutter build web --base-href "/" -t tool/screenshot_harness.dart

      - name: Install browser tools
        run: |
          npm install --no-save playwright http-server sharp
          npx playwright install --with-deps chromium

      - name: Capture real production screens
        run: |
          mkdir -p docs/screenshots
          npx http-server build/web -p 4173 -c-1 > /tmp/egypte-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          const crypto = require('crypto');
          const fs = require('fs');
          const BASE = 'http://127.0.0.1:4173/?screen=';
          const wait = (ms = 1800) => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 430, height: 1600 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
            });

            // Exactly one fresh screenshot per app page. Never stitch scroll frames
            // together: this prevents repeated viewport sections in a single image.
            const capture = async (screen, filename) => {
              const page = await context.newPage();
              await page.goto(BASE + screen, { waitUntil: 'networkidle' });
              await wait(5500);
              await page.screenshot({
                path: `docs/screenshots/${filename}.png`,
                fullPage: true,
                animations: 'disabled'
              });
              console.log('Captured one unique page image:', screen, '->', filename);
              await page.close();
            };

            await capture('language', '01-choix-langue');

            // Capture the three actual PresentationScreen PageView states.
            // Flutter Web text is not always exposed as ordinary DOM text, so
            // navigate with the real bottom CTA and verify each resulting image.
            const presentation = await context.newPage();
            await presentation.goto(BASE + 'presentation', { waitUntil: 'networkidle' });
            await wait(5000);

            const slideFiles = [
              'docs/screenshots/02-presentation-decouverte.png',
              'docs/screenshots/03-presentation-experiences.png',
              'docs/screenshots/04-presentation-bienvenue.png'
            ];
            const fileHash = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');

            await presentation.screenshot({
              path: slideFiles[0],
              fullPage: true,
              animations: 'disabled'
            });

            const advanceSlide = async (targetFile, previousFile) => {
              const tapY = await presentation.evaluate(() => window.innerHeight - 55);
              await presentation.mouse.click(345, tapY);
              await wait(1400);
              await presentation.screenshot({
                path: targetFile,
                fullPage: true,
                animations: 'disabled'
              });

              // If the CTA tap did not change the page, use a real horizontal
              // swipe on the PageView as a robust mobile interaction fallback.
              if (fileHash(targetFile) === fileHash(previousFile)) {
                const midY = Math.round((await presentation.evaluate(() => window.innerHeight)) / 2);
                await presentation.mouse.move(360, midY);
                await presentation.mouse.down();
                await presentation.mouse.move(70, midY, { steps: 12 });
                await presentation.mouse.up();
                await wait(1600);
                await presentation.screenshot({
                  path: targetFile,
                  fullPage: true,
                  animations: 'disabled'
                });
              }

              if (fileHash(targetFile) === fileHash(previousFile)) {
                throw new Error(`Onboarding did not advance: ${targetFile}`);
              }
            };

            await advanceSlide(slideFiles[1], slideFiles[0]);
            await advanceSlide(slideFiles[2], slideFiles[1]);
            await presentation.close();

            await capture('profile', '05-creation-profil');
            await capture('home', '06-accueil');
            await capture('settings', '07-parametres');
            await capture('cairo', '08-le-caire');
            await capture('alexandria', '09-alexandrie');
            await capture('luxor', '10-louxor');
            await capture('aswan', '11-assouan');
            await capture('siwa', '12-siwa');
            await capture('fayoum', '13-fayoum');
            await capture('desert', '14-desert');
            await capture('sharm', '15-sharm-el-sheikh');
            await capture('hurghada', '16-hurghada');
            await capture('gastronomy', '17-gastronomie');
            await capture('hieroglyphs', '18-hieroglyphes');

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify all README screenshots exist and are distinct
        run: |
          expected=(
            01-choix-langue 02-presentation-decouverte 03-presentation-experiences
            04-presentation-bienvenue 05-creation-profil 06-accueil 07-parametres
            08-le-caire 09-alexandrie 10-louxor 11-assouan 12-siwa 13-fayoum
            14-desert 15-sharm-el-sheikh 16-hurghada 17-gastronomie 18-hieroglyphes
          )
          for name in "${expected[@]}"; do
            test -s "docs/screenshots/$name.png" || {
              echo "Missing screenshot: $name.png"
              exit 1
            }
          done
          # Reject identical files: each app page must have its own screenshot.
          declare -A hashes
          for name in "${expected[@]}"; do
            hash=$(sha256sum "docs/screenshots/$name.png" | cut -d ' ' -f 1)
            if [[ -n "${hashes[$hash]:-}" ]]; then
              echo "Duplicate screenshot: $name.png matches ${hashes[$hash]}.png"
              exit 1
            fi
            hashes[$hash]="$name"
          done
          echo "Verified ${#expected[@]} distinct screenshots, one image per page."
          ls -lh docs/screenshots/*.png

      - name: Commit genuine screenshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: refresh real Flutter app screenshots"
          file_pattern: "docs/screenshots/*.png"
