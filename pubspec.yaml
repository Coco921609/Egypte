name: egypte
description: "Voyagez en Égypte en toute sérénité."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  get: ^4.7.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/caire/tour.jpg"
  web:
    generate: true
    image_path: "assets/caire/tour.jpg"
    background_color: "#0E131F"
    theme_color: "#E5C158"
  windows:
    generate: true
    image_path: "assets/caire/tour.jpg"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/egpyte.jpg
    - assets/images/
    - assets/caire/
    - assets/alexendrie/
    - assets/louxor/
    - assets/assouan/
    - assets/siwa/
    - assets/fayoum/
    - assets/desert/
    - assets/sharm/
    - assets/hurgada/
    - assets/plat/
    - assets/1.jpg
    - assets/2.jpg
    - assets/3.jpg
    - assets/23.jpeg